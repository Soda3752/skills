<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1b1f27;
    --muted: #626a78;
    --faint: #8b93a1;
    --border: #e1e4e9;
    --border-strong: #c9ced6;
    --accent: #2f6fed;
    --accent-soft: #edf3ff;
    --good: #17723a;
    --good-soft: #eef8f1;
    --bad: #b4400b;
    --bad-soft: #fdf3ec;
    --rec: #b45309;
    --rec-soft: #fef3c7;
    --side-w: 240px;
    --main-w: 1040px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 32px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.7 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }

  /* ── 版面：左側導覽 + 主欄 ── */
  /* 導覽貼齊畫面左緣，主欄在剩下的寬度裡置中 */
  .layout {
    display: grid;
    grid-template-columns: var(--side-w) minmax(0, 1fr);
  }
  aside.side {
    position: sticky; top: 0;
    height: 100vh;
    padding: 40px 20px 120px;
    overflow-y: auto;
    background: var(--surface);
    border-right: 1px solid var(--border);
  }
  .side-title { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 12px; }
  .side-progress { margin-bottom: 20px; }
  .side-progress .bar { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .side-progress .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  .side-progress .count { font-size: 13px; color: var(--muted); margin-top: 6px; }
  nav.toc { display: flex; flex-direction: column; gap: 2px; }
  nav.toc a {
    display: flex; gap: 10px; align-items: baseline;
    padding: 7px 10px;
    border-radius: 8px;
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    line-height: 1.4;
  }
  nav.toc a:hover { background: #f1f3f6; color: var(--text); }
  nav.toc a.current { background: var(--accent-soft); color: var(--text); font-weight: 600; }
  nav.toc .dot {
    flex: none; width: 18px; height: 18px; margin-top: 1px;
    border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #fff;
  }
  nav.toc a.done .dot { background: var(--accent); border-color: var(--accent); }
  nav.toc a.done .dot::after { content: "✓"; }
  nav.toc .toc-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  main { width: 100%; max-width: calc(var(--main-w) + 96px); margin: 0 auto; padding: 40px 48px 160px; min-width: 0; }

  /* ── 頁首 ── */
  .page-head { margin-bottom: 48px; }
  h1 { font-size: 28px; line-height: 1.3; margin: 0 0 12px; letter-spacing: .01em; }
  .intro { color: var(--muted); margin: 0; white-space: pre-wrap; font-size: 15px; }

  /* 手機版：導覽收起來，改成頂部細進度條 */
  .mobile-progress { display: none; }

  /* ── 題目 ── */
  section.q {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 26px 28px 22px;
    margin-bottom: 32px;
    transition: opacity .2s;
  }
  section.q.answered { opacity: .55; }
  section.q.answered:hover,
  section.q.answered:focus-within,
  section.q.answered.current { opacity: 1; }

  .q-meta { font-size: 13px; color: var(--faint); margin-bottom: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .q-meta .topic { color: var(--accent); font-weight: 600; }
  .q-meta .multi-tag { padding: 0 8px; border-radius: 99px; background: #f0f2f5; color: var(--muted); font-size: 12px; }
  .q-title { font-size: 22px; line-height: 1.45; font-weight: 700; margin: 0 0 6px; }
  .q-context { color: var(--muted); font-size: 15px; margin: 0 0 16px; white-space: pre-wrap; }
  .q-title + .options { margin-top: 16px; }

  .options { display: flex; flex-direction: column; gap: 10px; }

  /* ── 選項卡片 ── */
  .opt { display: block; position: relative; cursor: pointer; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt .card {
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .opt.recommended .card { border-left: 4px solid var(--rec); padding-left: 13.5px; }
  .opt:hover .card { border-color: var(--border-strong); }
  .opt.recommended:hover .card { border-left-color: var(--rec); }
  .opt input:focus-visible + .card { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt input:checked + .card { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
  .opt.recommended input:checked + .card { border-left-color: var(--rec); }

  .opt-head { display: grid; grid-template-columns: 22px 1fr; gap: 0 12px; align-items: start; }
  .mark {
    width: 20px; height: 20px; margin-top: 3px;
    border: 2px solid #a3acb9; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff;
  }
  .multi-q .mark { border-radius: 6px; }
  .opt input:checked + .card .mark { border-color: var(--accent); background: var(--accent); }
  .opt input:checked + .card .mark::after { content: "✓"; }
  .opt-label { font-size: 16px; font-weight: 600; line-height: 1.6; }
  .opt-label .letter { color: var(--accent); margin-right: 8px; }
  .rec { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; margin-left: 8px; border-radius: 99px; background: var(--rec-soft); color: var(--rec); vertical-align: 2px; }
  /* 說明接在選項名稱後面同一行 */
  .opt-desc { color: var(--muted); font-size: 14px; font-weight: 400; margin-left: 10px; }

  /* 「選了之後／代價」各一行：小色塊標籤 + 文字 */
  .tradeoff {
    display: grid; grid-template-columns: auto 1fr; gap: 4px 10px;
    margin: 6px 0 0 34px;
    font-size: 14px; line-height: 1.6;
  }
  .tradeoff .tag {
    font-size: 12px; font-weight: 700;
    padding: 0 8px; border-radius: 6px;
    line-height: 20px; margin-top: 1px;
    white-space: nowrap; text-align: center;
  }
  .tradeoff .tag.effect { background: var(--good-soft); color: var(--good); }
  .tradeoff .tag.cost { background: var(--bad-soft); color: var(--bad); }
  .tradeoff .txt { color: var(--text); }

  /* ── 補充說明 ── */
  .note { margin-top: 14px; }
  .note label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .note textarea {
    width: 100%; min-height: 48px; resize: vertical;
    font: inherit; font-size: 15px;
    padding: 10px 12px;
    border: 1.5px solid var(--border); border-radius: 10px;
    background: #fff; color: var(--text);
  }
  .note textarea:focus { outline: none; border-color: var(--accent); }
  .open-only .note { margin-top: 0; }

  /* ── 底部列 ── */
  footer.bottom {
    position: fixed; left: var(--side-w); right: 0; bottom: 0; z-index: 20;
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(6px);
    border-top: 1px solid var(--border);
    padding: 14px 48px;
  }
  .bottom-inner { max-width: var(--main-w); margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .bottom-inner .status { flex: 1; font-size: 14px; color: var(--muted); min-width: 180px; }
  button.copy {
    font: inherit; font-weight: 600;
    padding: 11px 24px;
    border: 0; border-radius: 10px;
    background: var(--accent); color: #fff;
    cursor: pointer;
  }
  button.copy:hover { filter: brightness(1.08); }
  button.ghost {
    font: inherit; font-size: 14px;
    padding: 10px 16px;
    border: 1px solid var(--border); border-radius: 10px;
    background: #fff; color: var(--muted); cursor: pointer;
  }
  #fallback { display: none; width: 100%; margin-top: 10px; min-height: 160px; font: 13px/1.5 ui-monospace, Menlo, monospace; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    aside.side { display: none; }
    main { padding: 28px 16px 160px; }
    .mobile-progress {
      display: block;
      position: sticky; top: 0; z-index: 10;
      background: var(--bg);
      padding: 10px 0;
      font-size: 13px; color: var(--muted);
    }
    .mobile-progress .bar { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 4px; }
    .mobile-progress .bar > i { display: block; height: 100%; width: 0; background: var(--accent); }
    section.q { padding: 24px 18px 20px; margin-bottom: 28px; }
    .q-title { font-size: 20px; }
    .tradeoff { margin-left: 0; }
    footer.bottom { left: 0; padding: 10px 16px; }
    .bottom-inner .status { flex-basis: 100%; font-size: 13px; }
    .bottom-inner button { flex: 1; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <p class="side-title">題目</p>
    <div class="side-progress">
      <div class="bar"><i class="js-bar"></i></div>
      <div class="count js-count">已答 0 / 0</div>
    </div>
    <nav class="toc" id="toc"></nav>
  </aside>

  <main>
    <div class="mobile-progress">
      <div class="bar"><i class="js-bar"></i></div>
      <span class="js-count">已答 0 / 0</span>
    </div>
    <header class="page-head">
      <h1 id="title"></h1>
      <p class="intro" id="intro"></p>
    </header>
    <div id="questions"></div>
  </main>
</div>

<footer class="bottom">
  <div class="bottom-inner">
    <span class="status" id="status">作答完按「複製所有答案」，回 Claude Code 貼上即可。</span>
    <button class="ghost" id="preview-btn" type="button">預覽文字</button>
    <button class="copy" id="copy-btn" type="button">複製所有答案</button>
    <textarea id="fallback" readonly></textarea>
  </div>
</footer>

<script type="application/json" id="form-data">__FORM_JSON__</script>
<script>
(function () {
  const data = JSON.parse(document.getElementById("form-data").textContent);
  const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const root = document.getElementById("questions");
  const toc = document.getElementById("toc");
  const total = data.questions.length;

  document.getElementById("title").textContent = data.title || "問題清單";
  document.title = data.title || "問題清單";
  const intro = document.getElementById("intro");
  if (data.intro) intro.textContent = data.intro; else intro.remove();

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  data.questions.forEach(function (q, qi) {
    const multi = !!q.multi;
    const opts = q.options || [];
    const sec = el("section", "q" + (multi ? " multi-q" : "") + (opts.length ? "" : " open-only"));
    sec.id = "q" + (qi + 1);

    // 導覽項目
    const link = el("a");
    link.href = "#" + sec.id;
    link.appendChild(el("span", "dot"));
    link.appendChild(el("span", "toc-label", "Q" + (qi + 1) + "　" + (q.header || q.question)));
    toc.appendChild(link);

    const meta = el("div", "q-meta");
    if (q.header) meta.appendChild(el("span", "topic", q.header));
    meta.appendChild(el("span", null, "Q" + (qi + 1) + " / " + total));
    if (multi) meta.appendChild(el("span", "multi-tag", "可複選"));
    sec.appendChild(meta);
    sec.appendChild(el("h2", "q-title", q.question));
    if (q.context) sec.appendChild(el("p", "q-context", q.context));

    if (opts.length) {
      const list = el("div", "options");
      opts.forEach(function (o, oi) {
        const label = el("label", "opt" + (o.recommended ? " recommended" : ""));
        const input = document.createElement("input");
        input.type = multi ? "checkbox" : "radio";
        input.name = "q" + qi;
        input.value = oi;
        if (!multi) {
          // 單選題再點一次已選的選項 = 取消選取
          label.addEventListener("pointerdown", function () { input.dataset.was = input.checked ? "1" : ""; });
          input.addEventListener("click", function () {
            if (input.dataset.was === "1") { input.checked = false; input.dataset.was = ""; refresh(); }
          });
        }
        label.appendChild(input);

        const card = el("div", "card");
        const head = el("div", "opt-head");
        head.appendChild(el("span", "mark"));
        const title = el("div", "opt-label");
        title.appendChild(el("span", "letter", LETTERS[oi]));
        title.appendChild(document.createTextNode(o.label));
        if (o.recommended) title.appendChild(el("span", "rec", "推薦"));
        if (o.desc) title.appendChild(el("span", "opt-desc", o.desc));
        head.appendChild(title);
        card.appendChild(head);

        if (o.effect || o.cost) {
          const tr = el("div", "tradeoff");
          if (o.effect) {
            tr.appendChild(el("span", "tag effect", "選了之後"));
            tr.appendChild(el("span", "txt", o.effect));
          }
          if (o.cost) {
            tr.appendChild(el("span", "tag cost", "代價"));
            tr.appendChild(el("span", "txt", o.cost));
          }
          card.appendChild(tr);
        }
        label.appendChild(card);
        list.appendChild(label);
      });
      sec.appendChild(list);
    }

    // 補充說明：每題一律展開，可以直接填
    const note = el("div", "note");
    const ta = document.createElement("textarea");
    ta.id = "note-" + qi;
    ta.placeholder = q.placeholder || (opts.length ? "可留空；都不是你要的，就直接寫你的想法" : "");
    const nl = el("label", null, opts.length ? "補充說明（選填）" : "你的回答");
    nl.htmlFor = ta.id;
    note.appendChild(nl);
    note.appendChild(ta);
    sec.appendChild(note);

    root.appendChild(sec);
  });

  const sections = Array.prototype.slice.call(document.querySelectorAll("section.q"));
  const links = Array.prototype.slice.call(toc.querySelectorAll("a"));

  // 捲動時標出目前所在的題目
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        const i = sections.indexOf(e.target);
        sections.forEach(function (s, j) { s.classList.toggle("current", i === j); });
        links.forEach(function (a, j) { a.classList.toggle("current", i === j); });
      });
    }, { rootMargin: "-40% 0px -55% 0px" });
    sections.forEach(function (s) { io.observe(s); });
  }

  function collect() {
    return data.questions.map(function (q, qi) {
      const picked = Array.prototype.slice
        .call(document.querySelectorAll('input[name="q' + qi + '"]:checked'))
        .map(function (i) { return Number(i.value); });
      const note = document.getElementById("note-" + qi).value.trim();
      return { q: q, picked: picked, note: note, answered: picked.length > 0 || note !== "" };
    });
  }

  function refresh() {
    const rows = collect();
    const done = rows.filter(function (r) { return r.answered; }).length;
    document.querySelectorAll(".js-bar").forEach(function (b) { b.style.width = (total ? (done / total) * 100 : 0) + "%"; });
    document.querySelectorAll(".js-count").forEach(function (c) { c.textContent = "已答 " + done + " / " + total; });
    sections.forEach(function (s, i) { s.classList.toggle("answered", rows[i].answered); });
    links.forEach(function (a, i) { a.classList.toggle("done", rows[i].answered); });
    return rows;
  }

  function buildText() {
    const rows = refresh();
    const out = ["# " + (data.title || "問題清單") + " — 作答結果", ""];
    rows.forEach(function (r, i) {
      const q = r.q;
      const hasOptions = (q.options || []).length > 0;
      out.push("Q" + (i + 1) + (q.header ? "【" + q.header + "】" : "") + " " + q.question + (q.multi ? "（複選）" : ""));
      if (r.picked.length) {
        out.push("答：" + r.picked.map(function (oi) { return LETTERS[oi] + " " + q.options[oi].label; }).join("、"));
      } else if (!r.note) {
        out.push("答：（未作答）");
      } else if (hasOptions) {
        out.push("答：（未選選項，見補充）");
      }
      if (r.note) out.push(hasOptions ? "補充：" + r.note : "答：" + r.note);
      out.push("");
    });
    const missing = rows.filter(function (r) { return !r.answered; }).length;
    if (missing) out.push("※ 尚有 " + missing + " 題未作答，請 Claude 自行判斷或採用推薦選項。");
    return out.join("\n").trim() + "\n";
  }

  function setStatus(msg) { document.getElementById("status").textContent = msg; }

  function showFallback(text) {
    const fb = document.getElementById("fallback");
    fb.value = text;
    fb.style.display = "block";
    // 底部列變高了，把內容區的留白跟著加高，避免蓋住最後一題
    document.querySelector("main").style.paddingBottom = (document.querySelector("footer.bottom").offsetHeight + 40) + "px";
    fb.focus();
    fb.select();
  }

  document.getElementById("copy-btn").addEventListener("click", function () {
    const text = buildText();
    const missing = collect().filter(function (r) { return !r.answered; }).length;
    const suffix = missing ? "（還有 " + missing + " 題未作答）" : "";
    function legacyCopy() {
      showFallback(text);
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      setStatus(ok ? "已複製" + suffix + "，回 Claude Code 貼上即可。" : "自動複製失敗，請在下方文字框按 ⌘C 手動複製。");
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () {
        setStatus("已複製" + suffix + "，回 Claude Code 貼上即可。");
      }, legacyCopy);
    } else {
      legacyCopy();
    }
  });

  document.getElementById("preview-btn").addEventListener("click", function () {
    showFallback(buildText());
    setStatus("下方是會被複製的文字。");
  });

  root.addEventListener("change", refresh);
  root.addEventListener("input", refresh);
  refresh();
})();
</script>
</body>
</html>
